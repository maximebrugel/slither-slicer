name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev --extra mcp

      - name: Install solc
        run: |
          uv run solc-select install 0.8.20
          uv run solc-select use 0.8.20

      - name: Lint
        run: uv run ruff check

      - name: Test
        run: uv run pytest -q
